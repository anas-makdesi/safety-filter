[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sfilter"
version = "0.1.0.dev0"
description = "Certified safety filters for learning-based control (RL, DeePC), learned from data with ddma."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Anas Makdesi" }]
dependencies = [
  "numpy>=1.22",
  "gymnasium>=0.29",
  "ddma @ git+https://github.com/anas-makdesi/ddma@v0.12.0",
]

[project.optional-dependencies]
rl = ["stable-baselines3>=2.0", "torch>=2.0"]
deepc = ["cvxpy>=1.4", "osqp>=0.6"]
plots = ["matplotlib>=3.5", "imageio>=2.20"]
real = ["scipy>=1.8", "remotezip>=0.12"]
dev = ["pytest>=7", "ruff>=0.4", "matplotlib>=3.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
